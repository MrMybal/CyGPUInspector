name: Showcase and documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/documentation.yml'
      - 'README*.md'
      - 'VERSION*.md'
      - 'website/**'
      - 'Docs/**'
      - '.CyDocBuild/**'
      - 'Assets/**'
      - 'LICENCES/**'
      - 'LICENSE'
      - 'THIRD-PARTY.md'
      - '.CyDocBuild/package*.json'
      - 'ThirdParty/CyDoc/**'
      - '.CyDocBuild/build.mjs'
      - '.CyDocBuild/check.mjs'
      - '.CyDocBuild/tests/reader.mjs'
      - '.CyDocBuild/tests/readme.mjs'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/Localization.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/ModPackage.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/Version.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/InProcessApi.h'
      - 'CyGPUInspectorApp/Source/Help/HelpLauncher.hpp'
  pull_request:
    paths:
      - '.github/workflows/documentation.yml'
      - 'README*.md'
      - 'VERSION*.md'
      - 'website/**'
      - 'Docs/**'
      - '.CyDocBuild/**'
      - 'Assets/**'
      - 'LICENCES/**'
      - 'LICENSE'
      - 'THIRD-PARTY.md'
      - '.CyDocBuild/package*.json'
      - 'ThirdParty/CyDoc/**'
      - '.CyDocBuild/build.mjs'
      - '.CyDocBuild/check.mjs'
      - '.CyDocBuild/tests/reader.mjs'
      - '.CyDocBuild/tests/readme.mjs'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/Localization.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/ModPackage.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/Version.hpp'
      - 'CyGPUInspectorCore/Include/CyGPUInspectorCore/InProcessApi.h'
      - 'CyGPUInspectorApp/Source/Help/HelpLauncher.hpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out documentation sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - name: Install pinned documentation dependencies
        run: npm --prefix .CyDocBuild ci
      - name: Build the showcase with the complete CyDoc manual
        run: node website/build.mjs
      - name: Verify the public site inventory, translations and manual
        run: node website/verify.mjs
      - name: Install the browser used by documentation tests
        working-directory: .CyDocBuild
        run: npx playwright install --with-deps chromium
      - name: Test the showcase through file URLs
        run: node website/tests.mjs
      - name: Test the application manual through file URLs
        run: node .CyDocBuild/tests/reader.mjs build/showcase/site/manual .CyDocBuild/internal/pages/checks/file
      - name: Test the hosted reader under the repository subpath
        env:
          CYGI_DOCS_TEST_TRANSPORT: http
        run: node .CyDocBuild/tests/reader.mjs build/showcase/site/manual .CyDocBuild/internal/pages/checks/http
      - name: Test keyboard and media controls with the runner's Chrome
        env:
          CYGI_DOCS_TEST_TRANSPORT: http
        run: |
          cygi_browser_path="$(command -v google-chrome)"
          CYGI_TEST_BROWSER="$cygi_browser_path" node .CyDocBuild/tests/reader.mjs build/showcase/site/manual .CyDocBuild/internal/pages/checks/chrome
      - name: Test the hosted showcase under the repository subpath
        run: |
          mkdir -p .CyDocBuild/internal/pages/checks
          node website/preview.mjs --port=43763 --base=/CyGPUInspector/ > .CyDocBuild/internal/pages/checks/showcase-server.log 2>&1 &
          cygi_preview_pid=$!
          trap 'kill "$cygi_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:43763/CyGPUInspector/; then break; fi
            sleep 1
          done
          cygi_browser_path="$(command -v google-chrome)"
          CYGI_SHOWCASE_URL="http://127.0.0.1:43763/CyGPUInspector/" CYGI_TEST_BROWSER="$cygi_browser_path" node website/tests.mjs
      - name: Upload only the complete public showcase and manual
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/showcase/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the showcase and documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 1200000
      - name: Check out the verification tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js for published-site verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - name: Install pinned verification dependencies
        run: npm --prefix .CyDocBuild ci
      - name: Download the exact Pages artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-pages
          path: .CyDocBuild/internal/pages/download
      - name: Extract the exact public site artifact
        run: |
          mkdir -p build/showcase/site
          tar -xf .CyDocBuild/internal/pages/download/artifact.tar -C build/showcase/site
      - name: Verify the files served by GitHub Pages
        env:
          DOCS_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node website/verify.mjs build/showcase/site --url "$DOCS_BASE_URL"
      - name: Test the public showcase with the runner's Chrome
        env:
          CYGI_SHOWCASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cygi_browser_path="$(command -v google-chrome)"
          CYGI_TEST_BROWSER="$cygi_browser_path" node website/tests.mjs
      - name: Test the actual public reader with the runner's Chrome
        env:
          CYGI_DOCS_URL: ${{ steps.deployment.outputs.page_url }}manual/Documentation.html
        run: |
          cygi_browser_path="$(command -v google-chrome)"
          CYGI_TEST_BROWSER="$cygi_browser_path" node .CyDocBuild/tests/reader.mjs build/showcase/site/manual .CyDocBuild/internal/pages/checks/published
      - name: Follow both published READMEs into the showcase and visual reader
        run: |
          cygi_browser_path="$(command -v google-chrome)"
          CYGI_TEST_BROWSER="$cygi_browser_path" node .CyDocBuild/tests/readme.mjs .CyDocBuild/internal/pages/checks/readme
